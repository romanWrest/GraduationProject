jwt:
  secret: ${JWT_SECRET:dev-secret-for-local-minimum-32-characters-please-override}
  issuer: auth-service
  public-paths:
    - /api/v1/auth/login
    - /api/v1/auth/register
    - /api/v1/auth/refresh
    - /api/v1/auth/password/reset-request
    - /api/v1/auth/password/reset
    - /actuator/**
    - /v3/api-docs/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /webjars/**
