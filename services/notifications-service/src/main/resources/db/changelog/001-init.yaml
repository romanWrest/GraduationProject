databaseChangeLog:
  - changeSet:
      id: 001-create-notification
      author: notifications-service
      changes:
        - createTable:
            schemaName: notifications
            tableName: notification
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: JSONB
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: read_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-notification-settings
      author: notifications-service
      changes:
        - createTable:
            schemaName: notifications
            tableName: notification_settings
            columns:
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: in_app_enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: by_type
                  type: JSONB
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-email-log
      author: notifications-service
      changes:
        - createTable:
            schemaName: notifications
            tableName: email_log
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: to_address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: template
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: subject
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: error_message
                  type: TEXT
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-create-processed-events
      author: notifications-service
      changes:
        - createTable:
            schemaName: notifications
            tableName: processed_events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: topic
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-indexes
      author: notifications-service
      changes:
        - createIndex:
            indexName: idx_notification_user_unread
            schemaName: notifications
            tableName: notification
            columns:
              - column:
                  name: user_id
              - column:
                  name: is_read
              - column:
                  name: created_at
                  descending: true
        - createIndex:
            indexName: idx_notification_user_created
            schemaName: notifications
            tableName: notification
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
                  descending: true
        - createIndex:
            indexName: idx_email_log_user
            schemaName: notifications
            tableName: email_log
            columns:
              - column:
                  name: user_id
              - column:
                  name: sent_at
                  descending: true
        - createIndex:
            indexName: idx_processed_events_type
            schemaName: notifications
            tableName: processed_events
            columns:
              - column:
                  name: event_type
              - column:
                  name: processed_at
