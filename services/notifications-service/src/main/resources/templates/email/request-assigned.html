<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Заявка назначена</title></head>
<body>
    <h1>Здравствуйте, <span th:text="${userName}">Пользователь</span>!</h1>
    <p>Заявка <strong>#<span th:text="${requestShortId}">—</span></strong> назначена исполнителю.</p>
    <p th:if="${scheduledAt}">Запланировано: <span th:text="${scheduledAt}">—</span></p>
    <p><a th:href="${actionUrl}" th:text="${actionUrl}">Открыть заявку</a></p>
</body>
</html>
