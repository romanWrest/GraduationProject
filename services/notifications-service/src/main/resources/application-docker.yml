spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/dormitory
  data:
    redis:
      host: redis
  kafka:
    bootstrap-servers: dormitory-kafka:29092
  mail:
    host: ${SMTP_HOST:mailhog}
    port: ${SMTP_PORT:1025}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}

integration:
  auth:
    url: http://auth-service:8081

management:
  otlp:
    tracing:
      endpoint: http://tempo:4318/v1/traces
