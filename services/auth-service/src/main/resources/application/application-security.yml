security:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: '*'
    exposed-headers: Authorization,Retry-After
    allow-credentials: true
    max-age: 3600
  service-token: ${SERVICE_TOKEN:dev-service-token-change-in-prod}

ratelimit:
  login:
    ip-max: 5
    ip-window-seconds: 60
    email-max: 10
    email-window-seconds: 300

password:
  bcrypt-cost: 12
  reset-ttl-minutes: 30
