integration:
  residents:
    url: ${RESIDENTS_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000

resilience4j:
  circuitbreaker:
    instances:
      residentsService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      residentsService:
        timeout-duration: 3s
        cancel-running-future: true

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
            logger-level: basic
          residents-service:
            connect-timeout: 2000
            read-timeout: 3000
